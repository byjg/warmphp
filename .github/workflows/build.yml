name: Build

on:
  push:
    branches: [ master ]
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ master ]

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The project has no dependencies, so there is no go.sum to key a
          # cache on; leaving it enabled fails the step.
          cache: false

      - name: Vet
        run: make lint

      # The tests run real PHP workers, in byjg/php:8.5-fpm-nginx through Docker
      # (the Makefile's WARMPHP_PHP), as they do locally.
      - name: Test
        run: make test

  # Every platform and package of a release, built but not published: a broken
  # .goreleaser.yaml or a platform that no longer compiles shows here, not on
  # the release tag.
  Build:
    needs: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the release, without publishing it
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean

  Documentation:
    if: github.ref == 'refs/heads/master'
    needs: Build
    uses: byjg/byjg.github.io/.github/workflows/add-doc.yaml@master
    with:
      folder: devops
      project: ${{ github.event.repository.name }}
    secrets: inherit
